<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Which one is your favorite?</h1>

    <!-- 1. Display an email using the <email> tag -->
    <div class="email-card">
      <h2>Option 1</h2>
      <email>haroldcaballero@example.com</email>
    </div>

    <!-- 2. Display an email using the <button> tag and <svg> tag with assets/email.svg inside, plus copy function -->
    <div class="email-card">
      <h2>Option 2</h2>
      <button class="btn-email" onclick="copyEmail('haroldcaballero@example.com', 'copy-feedback')">
        <img src="assets/email.svg">
      </button>
      <div id="copy-feedback" class="copy-feedback"></div>
    </div>

    <!-- 3. Display an email using HTML character entity codes in a <button> tag -->
    <div class="email-card">
      <h2>Option 3</h2>
      <strong
        class="btn-htmlcode">&#104;&#97;&#114;&#111;&#108;&#100;&#99;&#97;&#98;&#97;&#108;&#108;&#101;&#114;&#111;&#64;&#101;&#120;&#97;&#109;&#112;&#108;&#101;&#46;&#99;&#111;&#109;</strong>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
